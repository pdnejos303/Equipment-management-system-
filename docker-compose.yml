services:
  # ── Next.js App (SQLite) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Asset Management}
    container_name: equiptrack
    restart: unless-stopped
    ports:
      - "3003:3000"

    environment:
      # ── Database (SQLite) ──
      DATABASE_URL: "file:./dev.db"

      # ── Uploads (รูปจาก legacy + รูปใหม่) เก็บใน volume /app/uploads ──
      UPLOADS_DIR: "/app/uploads"

      # ── NextAuth ──
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # ── Google OAuth (optional) ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # ── Email / Cron / AI ──
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      ALERT_TO_EMAIL: ${ALERT_TO_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # ── App ──
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Asset Management}

    volumes:
      - equiptrack-uploads:/app/uploads
      - equiptrack-sqlite:/app/prisma

    networks:
      - internal

volumes:
  equiptrack-sqlite:
  equiptrack-uploads:

networks:
  internal:
    driver: bridge
