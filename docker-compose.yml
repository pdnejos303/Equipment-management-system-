services:
  # ── Next.js App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Asset Management}
    container_name: equiptrack
    restart: unless-stopped
    # ไม่ expose port ตรงสู่ภายนอกแล้ว — traffic ผ่าน Nginx เท่านั้น
    expose:
      - "3000"

    environment:
      # ── Database (SQLite — เก็บไฟล์บน volume /app/data) ──
      DATABASE_URL: "file:/app/data/prod.db"
      DIRECT_URL: "file:/app/data/prod.db"

      # ── Uploads (รูปจาก legacy + รูปใหม่) เก็บใน volume /app/uploads ──
      UPLOADS_DIR: "/app/uploads"

      # ── NextAuth ──
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # ── Google OAuth (optional) ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # ── Email / Cron / AI ──
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      ALERT_TO_EMAIL: ${ALERT_TO_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # ── App ──
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-Asset Management}

    volumes:
      - equiptrack-data:/app/data
      - equiptrack-uploads:/app/uploads

    networks:
      - internal

  # ── Nginx (Reverse Proxy + SSL Termination) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: equiptrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP → redirect ไป HTTPS
      - "443:443"  # HTTPS
    volumes:
      # config files
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      # SSL certificates จาก Certbot
      - certbot-certs:/etc/letsencrypt:ro
      # Certbot challenge path
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal

  # ── Certbot (Let's Encrypt auto-renew) ────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: equiptrack-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # renew certificate อัตโนมัติทุก 12 ชั่วโมง
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  equiptrack-data:
  equiptrack-uploads:
  certbot-certs:   # เก็บ SSL certificate
  certbot-www:     # เก็บ ACME challenge files

networks:
  internal:
    driver: bridge
