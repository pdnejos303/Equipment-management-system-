# Path: nginx/nginx.conf
# ──────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy + SSL Termination สำหรับ equip-track
# ใช้ร่วมกับ docker-compose.yml — Certbot จัดการ Let's Encrypt อัตโนมัติ
# ──────────────────────────────────────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  # ── Gzip compression ───────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml image/svg+xml;
  gzip_min_length 1000;

  # ── Security & Limits ──────────────────────────────────────────────────────
  # ขยายขนาดไฟล์อัปโหลดเป็น 20MB (ค่าเริ่มต้นของ Nginx คือ 1MB ซึ่งอัปรูปล้มเหลวแน่)
  client_max_body_size 20M;

  # Security Headers (ป้องกัน iframe, ป้องกันการเดาประเภทไฟล์, XSS Filter)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # ป้องกัน brute-force login — จำกัด 10 req/min ต่อ IP
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  # ป้องกัน API flood ทั่วไป — จำกัด 60 req/min ต่อ IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

  # ── [1] HTTP Server (Local / Dev) ───────────────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name localhost;   # ← สำหรับรัน local หรือใช้ IP ก็ได้

    # ── Rate limiting บน path สำคัญ ──────────────────────────────────────
    location /api/auth/ {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://app:3000;
      include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://app:3000;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Static assets — cache นาน ─────────────────────────────────────────
    location /_next/static/ {
      proxy_pass http://app:3000;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── ทุก path อื่น → Next.js app ──────────────────────────────────────
    location / {
      proxy_pass http://app:3000;
      include /etc/nginx/proxy_params.conf;
    }
  }
}
