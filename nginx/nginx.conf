# Path: nginx/nginx.conf
# ──────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy + SSL Termination สำหรับ equip-track
# ใช้ร่วมกับ docker-compose.yml — Certbot จัดการ Let's Encrypt อัตโนมัติ
# ──────────────────────────────────────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  # ── Gzip compression ───────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml image/svg+xml;
  gzip_min_length 1000;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # ป้องกัน brute-force login — จำกัด 10 req/min ต่อ IP
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  # ป้องกัน API flood ทั่วไป — จำกัด 60 req/min ต่อ IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

  # ── [1] HTTP → HTTPS redirect (port 80) ───────────────────────────────────
  server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # ← เปลี่ยนเป็น domain จริง

    # Certbot challenge path (ใช้ตอนออก certificate)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # redirect HTTP → HTTPS ทุก path
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── [2] HTTPS server (port 443) ───────────────────────────────────────────
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;   # ← เปลี่ยนเป็น domain จริง

    # ── SSL Certificate (Let's Encrypt via Certbot) ───────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ── SSL hardening ──────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;           # ปิด TLS 1.0, 1.1 (เก่า + มีช่องโหว่)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;                          # OCSP stapling — เร็วขึ้น + ปลอดภัย
    ssl_stapling_verify on;

    # ── HSTS — บังคับ HTTPS อย่างน้อย 2 ปี ──────────────────────────────
    # หมายเหตุ: preload จะทำให้ browser จำตลอดไป ถอนออกยาก
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Rate limiting บน path สำคัญ ──────────────────────────────────────
    location /api/auth/ {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://app:3000;
      include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://app:3000;
      include /etc/nginx/proxy_params.conf;
    }

    # ── Static assets — cache นาน ─────────────────────────────────────────
    location /_next/static/ {
      proxy_pass http://app:3000;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── ทุก path อื่น → Next.js app ──────────────────────────────────────
    location / {
      proxy_pass http://app:3000;
      include /etc/nginx/proxy_params.conf;
    }
  }
}
